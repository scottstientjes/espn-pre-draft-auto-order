<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ESPN Rankings Sync</title>
    <style>
      body {
        width: 340px;
        font: 13px/1.4 -apple-system, Segoe UI, Arial, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p.hint {
        color: #555;
        margin: 4px 0 10px;
      }
      input[type="file"] {
        width: 100%;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #f5f5f5;
        cursor: pointer;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: #0b5ed7;
        color: white;
        border-color: #0b5ed7;
      }
      #status {
        margin-top: 10px;
        white-space: pre-wrap;
        font-size: 12px;
        max-height: 220px;
        overflow-y: auto;
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 6px;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>ESPN Rankings Sync</h1>
    <p class="hint">
      Load your custom rankings CSV, then highlight it against your ESPN
      pre-draft list. You still hit Save on ESPN's page yourself.
    </p>

    <input id="csvFile" type="file" accept=".csv,text/csv" />

    <button id="highlightBtn" class="primary" disabled>
      Highlight rankings on page
    </button>
    <button id="reorderBtn" disabled>
      Auto-reorder (experimental)
    </button>
    <button id="stopBtn" disabled>Stop reorder</button>
    <button id="clearBtn" disabled>Clear highlights</button>

    <div id="status"></div>

    <script src="common/csv.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
